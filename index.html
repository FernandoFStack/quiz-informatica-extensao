<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mestre da Informática</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>Mestre da Informática</h1>
        <p>Aprenda conceitos reais com desafios divertidos!</p>
        <!-- Elemento de áudio escondido (loop ativado para a música não parar) -->
        <audio id="bg-music" loop>
            <source src="musica.mp3" type="audio/mpeg">
            Seu navegador não suporta áudio.
        </audio>

        <!-- Botão estiloso para ligar/desligar o som -->
        <button id="btn-audio" onclick="toggleAudio()" class="btn-audio-estilo">
            🔇 Música: Desligada
        </button>
    </header>

    <main>
        <div id="tela-cadastro" class="card">
    <h2>Bem-vindo ao Desafio!</h2>
    <p>Preencha seus dados para começar:</p>

        <div id="selecao-categoria" class="card hidden">
            <h2>Escolha um módulo:</h2>
            <div class="menu-modulos">
                <button class="botao-modulo" onclick="iniciarModulo('hardware')">💻 Hardware</button>
                <button class="botao-modulo" onclick="iniciarModulo('atalhos')">⌨️ Atalhos</button>
                <button class="botao-modulo" onclick="iniciarModulo('bits')">🔢 Bits e Lógica</button>
            </div>
        </div>

        <div id="quiz-container" class="card hidden"></div>
    </main>

    <footer style="margin-top: auto; padding: 20px; background: #161b22; border-top: 2px solid #58a6ff; text-align: center; color: #8b949e;">
    Desenvolvido por: <strong style="color: #58a6ff;">Fernando Fernandes Leite de Oliveira</strong> |
    Instituição: <strong style="color: #58a6ff;">Uninter</strong> |
    Ano: <strong style="color: #58a6ff;">2026</strong>
</footer>

    <script src="app.js"></script>
</body>
</html>
